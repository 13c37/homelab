server:
  port: 2333
  address: 0.0.0.0
lavalink:
  server:
    # password comes from env (LAVALINK_SERVER_PASSWORD)
    sources:
      youtube: false # native youtube is deprecated, the youtube-source plugin is used instead
    bufferDurationMs: 225
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 3
    opusEncodingQuality: 5
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 5000
    playerUpdateInterval: 3
    useSeekGhosting: true
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
  plugins:
    # pinned snapshot of upstream main (e41dd95, 2026-11-13): 1.18.2 is from july and its
    # tv client gets a 403; the fixes since are unreleased. back to a release once one ships.
    - dependency: "dev.lavalink.youtube:youtube-plugin:e41dd95f8bd134b51e75080fb28cc805fecb431a" # https://github.com/lavalink-devs/youtube-source
      snapshot: true
plugins:
  youtube:
    enabled: true
    # youtube bot-checks the server ip, so playback signs in with a throwaway
    # google account. first start prints a device code in the lavalink log;
    # the refresh token is passed via env (YT_REFRESH_TOKEN in .env, never committed).
    oauth:
      enabled: true
    # signatures are deciphered by the yt-cipher container (same stack, internal network)
    remoteCipher:
      url: "http://yt-cipher:8001"
      password: ""
      userAgent: "tanya"
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # tried in order. the tv client still gets a 403 from this ip, so more playback
    # clients follow (ios was fixed upstream in 6579cdf). web stays before ios:
    # search comes back empty otherwise (upstream #250).
    clients:
      - "TV" # playback only, needs oauth
      - "MUSIC"
      - "WEB"
      - "IOS"
      - "MWEB"
      - "WEBEMBEDDED"
      - "ANDROID_VR"
      - "TVHTML5_SIMPLY"
      - "ANDROID_MUSIC"
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
sentry:
  dsn: ""
  environment: ""
logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
    maxPayloadLength: 10000
