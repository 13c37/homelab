services:
  adguardhome:
    image: adguard/adguardhome:v1.0.0
    container_name: adguardhome
    network_mode: host          # DNS on :53 for the whole LAN
    restart: unless-stopped
    healthcheck:                # DNS actually answers (busybox nslookup in the image)
      test: ["CMD", "nslookup", "example.com", "127.0.0.1"]
      interval: 60s
      timeout: 5s
      retries: 3
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
