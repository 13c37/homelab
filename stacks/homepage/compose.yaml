services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=<server-ip>:3010
      - PUID=1000
      - PGID=1000
    volumes:
      - ./config:/app/config    # services.yaml, widgets.yaml, ... (not committed)
