# Public static website without opening a single port on the router:
# a Tailscale sidecar terminates HTTPS and publishes it via Tailscale Funnel,
# Caddy shares the sidecar's network namespace and serves ./www on 127.0.0.1:8080.
services:
  site-ts:
    image: tailscale/tailscale:v1.104.7
    hostname: ${TS_HOSTNAME:-site} # from .env; becomes https://<hostname>.<tailnet>.ts.net
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY} # from .env (never committed), see .env.example
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true        # no /dev/net/tun needed inside the unprivileged LXC
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped
  site:
    image: caddy:2.11.9-alpine
    network_mode: service:site-ts  # note: recreate both containers together
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro
    restart: unless-stopped
