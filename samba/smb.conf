# Samba runs natively in the Docker LXC (not in a container). Relevant parts only.
[global]
   server role = standalone server
   map to guest = never        # no guest fallback (Windows 11 blocks guest SMB anyway)
   log file = /var/log/samba/log.%m
   max log size = 1000

[media]
   path = /media
   read only = no
   valid users = <share-user>   # dedicated Samba user with its own password, not root
   force user = <share-user>
   create mask = 0664
   directory mask = 0775
   hosts allow = <lan-subnet> 127.
