# Proxmox LXC that runs all Docker stacks (values that identify the network are placeholders)
arch: amd64
cores: 2
memory: 8192
swap: 2048
ostype: debian
unprivileged: 1
features: keyctl=1,nesting=1                 # required for Docker inside an unprivileged LXC
dev0: /dev/dri/renderD128,gid=992            # iGPU passthrough for Jellyfin (Quick Sync)
mp0: /mnt/hdd/media,mp=/media                # media folder on the data disk
rootfs: local-lvm:vm-<id>-disk-0,size=30G
net0: name=eth0,bridge=vmbr0,gw=<gateway>,ip=<static-ip>/24,type=veth
nameserver: 9.9.9.9 149.112.112.112          # fixed upstream DNS, see README "DNS loop"
onboot: 1
